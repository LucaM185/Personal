<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photography — Luca Miglioli</title>
    <link rel="icon" href="../favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../css/styles.css">

    <style>
        .image-container {
            width: 100%;
        }

        .image-container img {
            width: 100%;
            height: auto;
            display: block;
        }

        .split-images {
            display: flex;
            width: 100%;
            justify-content: space-around;
        }

        .split-images img {
            width: 50%;
            height: auto;
        }

        /* Mixed aspect ratios in one row: each image grows by its aspect ratio (--ar), so all heights match */
        .mixed-images {
            display: flex;
            align-items: flex-start;
            width: 100%;
        }

        .mixed-images img {
            flex: var(--ar) 1 0;
            width: 0;
            height: auto;
        }

        .image-container, .split-images, .mixed-images {
            margin-bottom: 0;
        }

        @media screen and (max-width: 1910px) {
            .pano{
                display: none;
            }
        }


    </style>
</head>

    <a class="skip" href="#content">Skip to content</a>
