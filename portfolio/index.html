<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Image Layout</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap">
    <link href="https://fonts.cdnfonts.com/css/stretch-pro" rel="stylesheet">

    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            font-family: sans-serif;
        }

        .image-container {
            width: 100%;
        }

        .image-container img {
            width: 100%;
            height: auto;
            display: block;
        }

        .split-images, .three-images {
            display: flex;
            width: 100%;
            justify-content: space-around;
        }

        .split-images img {
            width: 50%;
            height: auto;
        }

        .three-images img {
            width: 33.33%;
            height: auto;
        }

        /* Mixed aspect ratios in one row: each image grows by its aspect ratio (--ar), so all heights match */
        .mixed-images {
            display: flex;
            align-items: flex-start;
            width: 100%;
        }

        .mixed-images img {
            flex: var(--ar) 1 0;
            width: 0;
            height: auto;
        }

        .image-container, .split-images, .three-images, .mixed-images {
            margin-bottom: 0;
        }

        /* Menu Icon and Name */
        .menu-container {
            position: fixed;
            top: 10px;
            left: 10px;
            display: flex;
            align-items: center;
            z-index: 1000;
            background: #fff; /* Background to ensure visibility */
            padding: 10px;
            border-radius: 5px;
            cursor: pointer; /* Make the whole div clickable */
            font-family: 'Stretch Pro';
        }

        .menu-icon {
            font-size: 36px;
            margin-right: 15px;
            color: #333;
        }

        .menu-name {
            font-size: 24px;
            color: #333;
            font-weight: 700;
        }
        .menu-end {
            font-size: 24px;
            color: #333;
            font-weight: 700;
        }
        
        /* Sidebar Styles */
        .sidebar {
            position: fixed;
            top: 0;
            left: -390px; /* Adjusted to fully hide sidebar at 350px */
            width: 335px; /* Sidebar width */
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            color: #fff;
            padding: 60px 20px 20px;
            transition: left 0.3s ease;
            z-index: 999;
            overflow-y: auto;
        }

        .sidebar.open {
            left: 0;
        }

        .sidebar h2 {
            margin-top: 0;
            font-size: 28px;
            font-weight: 700;
        }

        .sidebar a {
            color: #fff;
            text-decoration: none;
            display: block;
            margin: 5px 0;
        }

        .sidebar a:hover {
            text-decoration: underline;
        }

        .sidebar .bio {
            margin-bottom: 20px;
            font-size: 16px;
        }

        @media screen and (max-width: 1910px) {
            .pano{
                display: none;
            }
        }


        @media(orientation: landscape) {
        }

        @media (orientation: portrait) {
            .menu-end {
                display: none;
            }
            .menu-name {
                display: none;
            }
            .menu-icon {
                margin-right: 0;
            }
            .sidebar {
                width: 200px; 
            }
        }

    </style>
</head>
<body>

    <!-- Menu Icon and Name -->
    <div class="menu-container" id="menuContainer">
        <span class="material-icons menu-icon" id="menuIcon">menu</span>
        <span class="menu-name" id="menuName">LUCAM185</span><span class="menu-end"></span>
    </div>

    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
        <h2></h2>
        <h2 class="name-for-phone" style="font-size: 1em;">LUCA MIGLIOLI</h2>
        <p class="bio">20yo CS student. I do coding, photography, 3d printing, i love building things </p>         

        <h4 style="margin-bottom: 10px;"><em>Gear</em></h4>
        <label>Google Pixel 7a</label><br>
        <label>D3500 with kit lens</label><br>
        <label>I had a 17-50 2.8</label><br>
        <label>Sometimes i borrow a canon R7</label><br>
        <label>Windows laptop to edit</label><br>

        <h4 style="margin-bottom: 10px;"><em>Contacts</em></h4>
        <label >lucamig2004@gmail.com</label>
        <a href="tel:+393245911999">Phone: +393245911999</a>
        <a href="https://www.instagram.com/luca_miglioli" target="_blank">Instagram</a>
    </div>

    <!-- Main content -->
    <div class="image-container pano">
        <img src="images/01.jpg" alt="Main Image">
    </div>
    <div class="image-container">
        <img src="images/02.jpg" alt="Main Image">
    </div>

    <div class="split-images">
        <img src="images/03.jpg" alt="Split Image 1">
        <img src="images/04.jpg" alt="Split Image 2">
    </div>
    <div class="mixed-images">
        <img src="images/05.jpg" alt="Sun halo over a sea of clouds from a snowy slope" style="--ar: 1.333">
        <img src="images/06.jpg" alt="Chairlift silhouettes against the setting sun and a halo" style="--ar: 0.667">
    </div>
    <div class="image-container">
        <img src="images/07.jpg" alt="Main Image">
    </div>
    <div class="split-images">
        <img src="images/08.jpg" alt="Image 2">
        <img src="images/09.jpg" alt="Image 2">
    </div>
    <div class="three-images">
        <img src="images/10.jpg" alt="Mountain valley villages lit up under a starry sky" loading="lazy">
        <img src="images/11.jpg" alt="Fireworks in a misty valley below snowy peaks at night" loading="lazy">
        <img src="images/12.jpg" alt="Stars and clouds above a wooden roof edge" loading="lazy">
    </div>

    <div class="image-container">
        <img src="images/13.jpg" alt="Main Image">
    </div>
    <div class="mixed-images">
        <img src="images/14.jpg" alt="Mountain village street with an Italian flag under low clouds" style="--ar: 0.75" loading="lazy">
        <img src="images/15.jpg" alt="Green alpine valley under a cloudy sky, seen from a balcony" style="--ar: 1.333" loading="lazy">
    </div>
    <div class="image-container">
        <img src="images/16.jpg" alt="Main Image">
    </div>
    <div class="split-images">
        <img src="images/17.jpg" alt="Split Image 1">
        <img src="images/18.jpg" alt="Split Image 2">

    <div class="split-images">
        <img src="images/23.jpg" alt="Split Image 1">

    </div>
    <div class="mixed-images">
        <img src="images/25.jpg" alt="Autumn mountain village in fog, blurred from a moving train" style="--ar: 1.333" loading="lazy">
        <img src="images/26.jpg" alt="Driftwood dragon sculpture under a bright cloudy sky" style="--ar: 0.75" loading="lazy">
    </div>



    <script>
        const menuContainer = document.getElementById('menuContainer');
        const sidebar = document.getElementById('sidebar');
        const menuName = document.getElementById('menuName');
        const menuEnd = document.getElementsByClassName('menu-end')[0];
        let isNameToggled = false;

        const toggleSidebar = () => {
            sidebar.classList.toggle('open');
            isNameToggled = !isNameToggled;
            menuName.textContent = isNameToggled ? "PHOTOGRAPHY" : "LUCAM185";
            menuEnd.textContent = isNameToggled ? "" : "";
        };

        // Make the entire menu container clickable
        menuContainer.addEventListener('click', (event) => {
            event.stopPropagation();
            toggleSidebar();
        });

        // Close sidebar when clicking anywhere else on the page
        document.addEventListener('click', (event) => {
            if (sidebar.classList.contains('open') && !sidebar.contains(event.target)) {
                toggleSidebar();
            }
        });

        // Prevent clicks inside the sidebar from closing it
        sidebar.addEventListener('click', (event) => {
            event.stopPropagation();
        });
    </script>
</body>
</html>
