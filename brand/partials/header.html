      <button class="qr-trigger" type="button" aria-haspopup="dialog" aria-controls="qr-dialog" aria-expanded="false" aria-label="Show QR codes" title="Show QR codes">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM15 14h2v2h-2zM18 14h2v2h-2zM14 17h2v3h-2zM17 18h3v2h-3z"/>

<div class="qr-dialog" id="qr-dialog" hidden>
  <div class="qr-dialog-backdrop" data-qr-close></div>
  <section class="qr-dialog-panel" role="dialog" aria-modal="true" aria-labelledby="qr-dialog-title" tabindex="-1">
    <div class="qr-dialog-head">
      <div>
        <p class="kicker">Scan to open</p>
        <h2 id="qr-dialog-title">Choose a QR code</h2>
      </div>
      <button class="qr-close" type="button" data-qr-close aria-label="Close QR codes">
        <span aria-hidden="true"></span>
      </button>
    </div>

    <div class="qr-carousel-wrap">
      <button class="qr-arrow qr-arrow--prev" type="button" data-qr-prev aria-label="Previous QR code">
        <span aria-hidden="true">‹</span>
      </button>
      <div class="qr-carousel" data-qr-carousel tabindex="0" aria-label="QR code choices">
        <figure class="qr-slide" data-qr-slide>
          <div class="qr-image"><img src="../codes/brand/qrcode_a1.svg" alt="Classic QR code for the Industrial workflows website"></div>
          <figcaption>Classic</figcaption>
        </figure>
        <figure class="qr-slide" data-qr-slide>
          <div class="qr-image"><img src="../codes/brand/qrcode_c2%20(1).svg" alt="Textured LM monogram QR code for the Industrial workflows website"></div>
          <figcaption>Textured monogram</figcaption>
        </figure>
        <figure class="qr-slide" data-qr-slide>
          <div class="qr-image"><img src="../codes/brand/qrcode_c2.svg" alt="Minimal LM monogram QR code for the Industrial workflows website"></div>
          <figcaption>Minimal monogram</figcaption>
        </figure>
      </div>
      <button class="qr-arrow qr-arrow--next" type="button" data-qr-next aria-label="Next QR code">
        <span aria-hidden="true">›</span>
      </button>
    </div>

    <p class="qr-site-link">
      <a href="https://lucam185.github.io/personal/brand" target="_blank" rel="noopener noreferrer">lucam185.github.io/personal/brand</a>
    </p>

    <div class="qr-dialog-foot">
      <div class="qr-dots" role="group" aria-label="Select QR code">
        <button type="button" data-qr-dot="0" aria-label="Show Classic QR code" aria-current="true"></button>
        <button type="button" data-qr-dot="1" aria-label="Show Textured monogram QR code"></button>
        <button type="button" data-qr-dot="2" aria-label="Show Minimal monogram QR code"></button>
      </div>
      <p class="qr-swipe-hint">Swipe or use the arrows <span data-qr-count>1 / 3</span></p>
    </div>
  </section>
</div>
